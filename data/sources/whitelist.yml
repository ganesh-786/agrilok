# -----------------------------------------------------------------------------
# EXCLUDED - do not propose these again.
# -----------------------------------------------------------------------------
excluded:
  - pattern: "coaching centre notes, PDF aggregators, exam-prep blogs"
    reason: >-
      Not official. A student cannot verify them against an authority, which is
      the entire point of this product. Accuracy is not the test; verifiability
      is.
  - pattern: "Facebook groups, YouTube channels, Telegram channels"
    reason: "Unverifiable, unstable, and a known route for wrong facts to spread."
  - pattern: "any domain whose robots.txt disallows the paths we need"
    reason: >-
      Honoured without exception. No alternate user-agent, no 'just for
      testing'. See docs/crawl-policy.md.
