  # --- Unverified model questions ----------------------------------------
  # NOT real past-paper questions and NEVER counted toward the gate. These
  # come from two compiled MCQ sets supplied for research: an Officer-level
  # set on the letterhead of a coaching institute (typed, not scanned, with
  # the institute's own key and notes, header claiming 100 questions but
  # containing 50, claiming a federal Level 7 sitting on 2083/05/20 that
  # could not be corroborated), and an untitled set with no institute, date
  # or exam name (numbering gaps, garbled options, and an answer key that
  # contradicts its own note). Neither meets the bar the Koshi Level 4 paper
  # met, so the question text is provenance-unknown.
  #
  # What makes them useful is the ANSWER side. Each reference answer below was
  # verified against a primary government document in the corpus (REF-04, the
  # Constitution of Nepal, Unicode edition), not against the coaching key.
  # That lets these test the thing a syllabus-only corpus never could: given
  # the primary text, does the pipeline answer faithfully with a citation, or
  # over-refuse. expected_behavior is what a careful human reading of the
  # corpus supports, not what the pipeline currently does.
  - id: U-01
    type: unverified_model_question
    question: "Which article of the Constitution of Nepal 2072 emphasizes the state's responsibility to ensure food sovereignty? (A) Article 26 (B) Article 36 (C) Article 47 (D) Article 57"
    reference_answer: "(B) Article 36 (the right relating to food); the right to food sovereignty is its clause (3)."
    answer_verified_against: "REF-04, Article 36 (खाद्य सम्बन्धी हक), clause (3)"
    expected_behavior: answer
    filters: { level: 7 }
