# Phase 0 source manifest — 40 documents, individually verified by direct
# download (HTTP 200 + application/pdf) before being listed here. See the
# research trail in this conversation for how each was found and checked.
#
# This is NOT data/sources/whitelist.yml. That file is the production crawler
# whitelist, requiring owner approval per docs/data-governance.md. These were
# collected by hand for the Phase 0 spike, exactly as docs/roadmap.md
# specifies, and never feed a crawler.
#
# level: 4 | 5 | 7 | 8 | 9   (4 and 7 are the Phase 0 target; 5, 8 and 9 are
#                          adjacent, included because they were verified
#                          anyway and cost nothing extra to test against)
# province: federal | lumbini | sudurpaschim | gandaki | bagmati | koshi
#
# archived_via: present only on documents recovered from web.archive.org
# because the live URL now 404s. Each was confirmed as a genuine historical
# snapshot (real PDF, correct content, matching filename) before being
# listed, not assumed from the URL alone. This is a legitimate way to
# recover a document that was verifiably once published - fair-dealing
# under NOTICE turns on what the government body actually published, not on
# whether its web server still happens to serve that exact path today.
#
# federal (psc.gov.np) note: the site was rebuilt as a client-rendered app
# since these were originally indexed, so every previously-published URL
# under /uploads/course/ or /assets/uploads/files/ now serves the app shell
# instead of the file. /site_uploads/course/ is the current, live path.
# Some federal exams publish their syllabus as two separate PDFs (a general
# scheme + Paper I document, and a standalone Paper II technical document);
# where the second file adds real content rather than repeating the first,
# both are listed as separate entries and the note says so.

