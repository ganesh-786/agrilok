name: Golden-set evaluation

# Retrieval is where RAG systems fail. Any change to chunking, embeddings,
# retrieval parameters or prompts must be measured against the golden set
# before it can merge. See docs/evaluation.md.
#
# A run needs two repository secrets kept apart from production:
#   GEMINI_API_KEY_EVAL  its own key, so a run can never spend students' quota
#   DATABASE_URL_EVAL    a database holding an admitted, embedded corpus
# Without them, for example on a pull request from a fork, the job warns and
# a reviewer must paste before and after numbers into the PR by hand.
#
# A green run means nothing regressed that a machine can see. Faithfulness of
# the answered rows is still read by a person (ADR-0006).

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/core/**"
      - "services/ingestion/**"
      - "services/evaluation/**"
      - "apps/api/**"
      - "data/golden-set/**"
      - "infra/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Faithfulness and retrieval quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_EVAL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_EVAL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the evaluation secrets are available
        id: guard
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ] && [ -n "$DATABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No evaluation secrets, so the golden set did not run. A reviewer must confirm faithfulness by hand before merge."
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the harness
        if: steps.guard.outputs.ready == 'true'
        run: |
          uv python install
          uv sync --frozen --package agrilok-evaluation
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run the golden set
        if: steps.guard.outputs.ready == 'true'
        working-directory: services/evaluation
        run: python -m evaluation.run --report reports/summary.json --markdown reports/summary.md

      - name: Enforce the gate
        if: steps.guard.outputs.ready == 'true'
        working-directory: services/evaluation
        run: python -m evaluation.gate --report reports/summary.json

      - name: Upload report
        if: steps.guard.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-${{ github.run_id }}
          path: services/evaluation/reports/
          if-no-files-found: ignore
          retention-days: 90
