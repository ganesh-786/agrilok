name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. A job that needs more must ask for it locally.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.18"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Which components actually exist yet? The repo is scaffolded ahead of the
  # code, so every build job is gated on its component being present. This keeps
  # CI green and honest instead of red and ignored.
  # ---------------------------------------------------------------------------
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
      python: ${{ steps.check.outputs.python }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        shell: bash
        run: |
          if [ -f apps/web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/web has no package.json yet - skipping web job."
          fi

          if ls apps/api/pyproject.toml services/*/pyproject.toml >/dev/null 2>&1; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Python project files yet - skipping python job."
          fi

  # ---------------------------------------------------------------------------
  # Runs on every change, including today when there is no application code.
  # These are the invariants that protect students and secrets.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it and rotate every key in it."
            exit 1
          fi
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Environment files are tracked: $bad"
            exit 1
          fi
          echo "No tracked environment files."

      - name: No hardcoded API keys
        shell: bash
        run: |
          set -uo pipefail
          # Google API keys start AIza; Supabase/JWT service keys start eyJ.
          hits=$(git grep -nE '(AIza[0-9A-Za-z_-]{30,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' \
                   -- . ':(exclude).github/workflows/ci.yml' || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible credential committed:"
            echo "$hits"
            exit 1
          fi
          echo "No credential-shaped strings found."

      - name: Required governance files are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in README.md LICENSE LICENSE-CONTENT NOTICE CONTRIBUTING.md \
                   CODE_OF_CONDUCT.md SECURITY.md .env.example \
                   data/sources/whitelist.yml; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required file is missing."
              missing=1
            fi
          done
          exit $missing

      - name: Validate YAML and JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import json, pathlib, sys
          import yaml

          failed = False
          skip = {".git", "node_modules", ".venv"}

          for path in pathlib.Path(".").rglob("*"):
              if any(part in skip for part in path.parts) or not path.is_file():
                  continue
              try:
                  if path.suffix in {".yml", ".yaml"}:
                      yaml.safe_load(path.read_text(encoding="utf-8"))
                  elif path.suffix == ".json":
                      json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"::error file={path}::{exc}")
                  failed = True

          sys.exit(1 if failed else 0)
          PY

  web:
    name: Web (lint, typecheck, build)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  python:
    name: Python (lint, typecheck, test)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [apps/api, services/crawler, services/ingestion, services/evaluation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Skip components that do not exist yet
        id: exists
        shell: bash
        run: |
          if [ -f "${{ matrix.component }}/pyproject.toml" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.run == 'true'
        working-directory: ${{ matrix.component }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - if: steps.exists.outputs.run == 'true'
        working-directory: ${{ matrix.component }}
        run: ruff check .

      - if: steps.exists.outputs.run == 'true'
        working-directory: ${{ matrix.component }}
        run: ruff format --check .

      - if: steps.exists.outputs.run == 'true'
        working-directory: ${{ matrix.component }}
        run: mypy .

      - if: steps.exists.outputs.run == 'true'
        working-directory: ${{ matrix.component }}
        run: pytest -q
