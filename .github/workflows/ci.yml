name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. A job that needs more must ask for it locally.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The invariants that protect students and secrets. Cheap, and first.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it and rotate every key in it."
            exit 1
          fi
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Environment files are tracked: $bad"
            exit 1
          fi
          echo "No tracked environment files."

      - name: No hardcoded API keys
        shell: bash
        run: |
          set -uo pipefail
          # Google API keys start AIza; Supabase/JWT service keys start eyJ.
          hits=$(git grep -nE '(AIza[0-9A-Za-z_-]{30,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' \
                   -- . ':(exclude).github/workflows/ci.yml' || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible credential committed:"
            echo "$hits"
            exit 1
          fi
          echo "No credential-shaped strings found."

      - name: Required governance files are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in README.md LICENSE LICENSE-CONTENT NOTICE CONTRIBUTING.md \
                   CODE_OF_CONDUCT.md SECURITY.md .env.example \
                   data/sources/whitelist.yml; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required file is missing."
              missing=1
            fi
          done
          exit $missing

      - name: Validate YAML and JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import json, pathlib, subprocess, sys
          import yaml

          # Tracked files only: build output and dependencies are not ours to check.
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True)
          failed = False
          for name in files.stdout.splitlines():
              path = pathlib.Path(name)
              try:
                  if path.suffix in {".yml", ".yaml"}:
                      yaml.safe_load(path.read_text(encoding="utf-8"))
                  elif path.suffix == ".json":
                      json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"::error file={path}::{exc}")
                  failed = True

          sys.exit(1 if failed else 0)
          PY

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      # No API is running here. Every page renders on request, and the
      # sitemap falls back to the fixed pages, so the build must still pass.
      - run: npm run build

  python:
    name: Python (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - packages/core
          - apps/api
          - infra
          - services/ingestion
          - services/evaluation
          - services/crawler
    services:
      # The same Postgres and pgvector versions the local `agrilok-db start` runs.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Set, so a database that never came up fails the run instead of every
      # database test quietly skipping (infra/src/agrilok_infra/testing.py).
      AGRILOK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Tests use a fake Gemini client. No key here proves none of them can
      # reach the real API or spend quota.
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # One lockfile for the workspace. `--frozen` fails if uv.lock is stale
      # rather than quietly resolving something new. The `local` extra
      # (embedded Postgres) is left out: the service container replaces it.
      - name: Install the workspace
        run: |
          uv python install
          uv sync --frozen --all-packages --extra observability
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - working-directory: ${{ matrix.component }}
        run: ruff check .

      - working-directory: ${{ matrix.component }}
        run: ruff format --check .

      - working-directory: ${{ matrix.component }}
        run: mypy .

      - working-directory: ${{ matrix.component }}
        run: pytest -q -rs
