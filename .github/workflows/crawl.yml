name: Scheduled crawl

# Re-crawls the whitelisted official sources and opens a review issue when a
# published document has changed. See docs/crawl-policy.md and
# docs/runbooks/crawl-failure.md.
#
# The schedule only ever does a dry run: it checks the whitelist and prints
# what would be fetched, and requests nothing from any source. A live crawl
# is started by hand (Actions > Scheduled crawl > Run workflow) with "dry run"
# unticked. Letting the schedule crawl for real is a decision for the
# whitelist owner, made by changing DRY_RUN below in a reviewed PR.

on:
  schedule:
    # 02:30 Asia/Kathmandu (20:45 UTC) daily - off-peak for the source sites.
    - cron: "45 20 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Crawl a single source id from data/sources/whitelist.yml (blank = all)"
        required: false
        type: string
      dry_run:
        description: "Fetch nothing; only report what would be fetched"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  # Never run two crawls at once. Politeness to the source sites is a hard
  # requirement, not a preference.
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl whitelisted sources
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Live only when a person started the run and unticked "dry run".
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the crawler
        run: |
          uv python install
          uv sync --frozen --package agrilok-crawler
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Change detection compares against the manifest of earlier fetches
      # (urls, dates and checksums, no document content). Each run starts from
      # a clean checkout, so the manifest is carried between runs in the cache;
      # without it every document would be reported as new every time. The
      # fetched files themselves are never uploaded anywhere.
      - name: Restore the fetch manifest
        if: env.DRY_RUN == 'false'
        uses: actions/cache/restore@v4
        with:
          path: data/raw/manifest.jsonl
          key: crawl-manifest-${{ github.run_id }}
          restore-keys: crawl-manifest-

      - name: Crawl
        env:
          # A repository variable naming the project and a contact address.
          # The crawler refuses to make a request without it.
          CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT }}
          CRAWLER_RESPECT_ROBOTS_TXT: "true"
          SOURCE_FILTER: ${{ inputs.source }}
        run: python -m crawler.run

      - name: Save the fetch manifest
        if: env.DRY_RUN == 'false' && always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/manifest.jsonl
          key: crawl-manifest-${{ github.run_id }}

      - name: Upload crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-report-${{ github.run_id }}
          path: services/crawler/reports/
          if-no-files-found: ignore
          retention-days: 30

      # Changed source documents must never publish straight to students.
      # They open a review issue and wait for a human. See CONTRIBUTING.md.
      - name: Open review issue for changed documents
        if: env.DRY_RUN == 'false' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report=services/crawler/reports/changed.md
          if [ -s "$report" ]; then
            gh issue create \
              --title "[review] Source documents changed on $(date -u +%Y-%m-%d)" \
              --label "content-review,automated" \
              --body-file "$report"
          else
            echo "No source documents changed."
          fi
