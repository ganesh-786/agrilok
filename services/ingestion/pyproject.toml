[project]
name = "agrilok-ingestion"
version = "0.1.0"
description = "Raw documents to retrievable chunks, with the human review queue in the path."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "agrilok-core",
  # PDF text layer (ADR-0002). Apache-2.0 / BSD-3-Clause, chosen over PyMuPDF
  # (AGPL-3.0) so a private fork carries no copyleft obligation; see NOTICE.
  "pypdfium2>=4.30",
  "pyyaml>=6.0",
]

[project.scripts]
agrilok-ingest = "ingestion.cli:main"

[tool.uv.sources]
agrilok-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
