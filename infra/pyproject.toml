[project]
name = "agrilok-infra"
version = "0.1.0"
description = "Schema migrations, reference data and the local development database for agrilok."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Embedded PostgreSQL + pgvector for local development only (Apache-2.0,
# bundling PostgreSQL and pgvector under the PostgreSQL License). Production
# points DATABASE_URL at a hosted Postgres and never installs this.
local = ["pgembed>=0.2"]

[project.scripts]
agrilok-db = "agrilok_infra.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agrilok_infra"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pgembed", "pgembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
